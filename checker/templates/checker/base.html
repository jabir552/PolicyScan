<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PolicyScan - Compliance Checker{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bs-primary-rgb: 13, 110, 253;
            --brand-dark: #0f172a;
            --card-border: #e2e8f0;
        }
        body {
            background-color: #f8fafc;
            color: #334155;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .card {
            border: 1px solid var(--card-border);
            border-radius: 12px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
        }
        .card-header {
            background-color: #ffffff;
            border-bottom: 1px solid var(--card-border);
            font-weight: 600;
        }
        .badge-pass {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }
        .badge-missing {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
        .badge-review {
            background-color: #fef3c7;
            color: #b45309;
            border: 1px solid #fde68a;
        }
        .snippet-box {
            background-color: #f1f5f9;
            border-left: 4px solid #0284c7;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.88rem;
            color: #1e293b;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        footer {
            margin-top: auto;
            border-top: 1px solid var(--card-border);
            background-color: #ffffff;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'index' %}">
                <i class="bi bi-shield-check text-primary fs-4"></i>
                <span>PolicyScan</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto align-items-center gap-1">
                    <li class="nav-item">
                        <a class="nav-link px-3" href="{% url 'index' %}"><i class="bi bi-search me-1"></i> New Scan</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="{% url 'history' %}"><i class="bi bi-clock-history me-1"></i> Scan History</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="{% url 'demo_sample' %}?type=compliant" target="_blank">
                            <i class="bi bi-file-earmark-code me-1"></i> Sample Pages
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container py-4 flex-grow-1">
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-{{ msg.tags|default:'info' }} alert-dismissible fade show shadow-sm" role="alert">
                    {{ msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="py-3 text-muted text-center text-sm">
        <div class="container">
            <p class="mb-0 small">
                PolicyScan &bull; A2P 10DLC Policy Compliance Engine
            </p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
